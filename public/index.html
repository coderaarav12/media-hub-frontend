<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediaHub - Movies, TV & Anime</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#13131a;--card-hover:#1c1c26;--accent:#2392ee;--accent2:#7c3aed;--text:#f0f0f5;--muted:#8888a0;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#333;border-radius:4px}
a{color:var(--accent);text-decoration:none}
.container{max-width:1400px;margin:0 auto;padding:0 20px}

/* Nav */
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:20px;position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.9);backdrop-filter:blur(12px)}
.logo{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search-box{flex:1;max-width:600px;display:flex;gap:8px}
.search-box input{flex:1;padding:12px 16px;border-radius:var(--radius);border:1px solid #222;background:var(--card);color:var(--text);font-size:15px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box select{padding:12px;border-radius:var(--radius);border:1px solid #222;background:var(--card);color:var(--text);font-size:14px;outline:none}
.nav-links{display:flex;gap:16px;align-items:center}
.nav-links button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:8px 16px;border-radius:var(--radius);transition:all .2s;font-weight:500}
.nav-links button:hover,.nav-links button.active{color:var(--text);background:var(--card)}

/* Hero */
.hero{position:relative;border-radius:var(--radius);overflow:hidden;margin:16px 0 32px;height:400px;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)}
.hero-content{position:absolute;bottom:0;left:0;right:0;padding:40px;background:linear-gradient(transparent,rgba(0,0,0,0.9))}
.hero-content h1{font-size:36px;font-weight:800;margin-bottom:8px}
.hero-content p{color:var(--muted);max-width:600px;font-size:15px;line-height:1.5}
.hero-content .badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:12px}
.hero-content .badge.trending{background:var(--accent2);color:#fff}

/* Grid */
.section-header{display:flex;justify-content:space-between;align-items:center;margin:32px 0 16px}
.section-header h2{font-size:22px;font-weight:700}
.section-header .see-all{color:var(--muted);font-size:14px;cursor:pointer;font-weight:500;transition:color .2s}
.section-header .see-all:hover{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}

/* Card */
.card{cursor:pointer;border-radius:var(--radius);overflow:hidden;background:var(--card);transition:transform .2s,box-shadow .2s;position:relative}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(35,146,238,0.15)}
.card-poster{aspect-ratio:2/3;background-size:cover;background-position:center;position:relative;background-color:#1a1a1a}
.card-poster .rating{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.8);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;color:#ffc107}
.card-poster .episodes-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.8);padding:2px 8px;border-radius:4px;font-size:11px;color:var(--accent)}
.card-info{padding:12px}
.card-info h3{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-info p{font-size:12px;color:var(--muted);margin-top:4px}

/* Detail */
.detail-page{display:none;padding-top:16px}
.detail-hero{position:relative;border-radius:var(--radius);overflow:hidden;min-height:500px;margin-bottom:24px}
.detail-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(0.3)}
.detail-overlay{position:relative;padding:60px 40px;display:flex;gap:32px;align-items:flex-end}
.detail-poster{width:220px;border-radius:var(--radius);aspect-ratio:2/3;background-size:cover;background-position:center;flex-shrink:0;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.detail-info{flex:1}
.detail-info h1{font-size:32px;font-weight:800;margin-bottom:8px}
.detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.detail-meta span{padding:4px 12px;border-radius:20px;font-size:12px;background:rgba(255,255,255,0.08)}
.detail-info .overview{color:var(--muted);font-size:14px;line-height:1.6;max-width:700px;margin-bottom:16px}
.detail-actions{display:flex;gap:12px;margin-bottom:16px}
.btn-play{padding:14px 32px;border-radius:var(--radius);border:none;font-size:16px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:transform .2s,box-shadow .2s}
.btn-play:hover{transform:scale(1.02);box-shadow:0 8px 24px rgba(35,146,238,0.3)}
.btn-secondary{padding:14px 24px;border-radius:var(--radius);border:1px solid #333;background:transparent;color:var(--text);font-size:14px;cursor:pointer;transition:all .2s}
.btn-secondary:hover{background:var(--card);border-color:var(--accent)}
.genre-tags{display:flex;flex-wrap:wrap;gap:6px}
.genre-tags span{padding:4px 12px;border-radius:20px;font-size:12px;background:rgba(35,146,238,0.12);color:var(--accent);border:1px solid rgba(35,146,238,0.2)}

/* Seasons Tabs */
.season-tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:16px}
.season-tabs button{padding:8px 20px;border-radius:var(--radius);border:1px solid #222;background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:14px;transition:all .2s}
.season-tabs button:hover{border-color:var(--accent);color:var(--text)}
.season-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Episodes */
.episodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.episode-card{cursor:pointer;display:flex;gap:12px;padding:12px;border-radius:var(--radius);background:var(--card);transition:background .2s}
.episode-card:hover{background:var(--card-hover)}
.episode-thumb{width:160px;height:90px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0;background-color:#1a1a1a}
.episode-info{flex:1;min-width:0}
.episode-info h4{font-size:14px;font-weight:600;margin-bottom:4px}
.episode-info p{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.episode-num{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px}

/* Player */
.player-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:1000;display:none;flex-direction:column}
.player-overlay.active{display:flex}
.player-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:rgba(0,0,0,0.5)}
.player-header h3{font-size:16px;font-weight:600}
.player-header button{background:none;border:none;color:var(--text);font-size:28px;cursor:pointer;padding:4px 12px;border-radius:8px;transition:background .2s}
.player-header button:hover{background:rgba(255,255,255,0.1)}
.player-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px}
.player-body iframe{width:100%;max-width:1100px;height:calc(100vh - 180px);border:none;border-radius:12px;background:#000}
.source-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.source-tabs button{padding:8px 20px;border-radius:var(--radius);border:1px solid #333;background:rgba(255,255,255,0.05);color:var(--muted);cursor:pointer;font-size:13px;transition:all .2s}
.source-tabs button:hover{color:var(--text);border-color:var(--accent)}
.source-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Trending tabs */
.trend-tabs{display:flex;gap:8px;margin-bottom:16px}
.trend-tabs button{padding:8px 20px;border-radius:var(--radius);border:1px solid #222;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;transition:all .2s}
.trend-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.trend-tabs button:hover:not(.active){border-color:var(--accent);color:var(--text)}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--muted)}
.spinner{width:40px;height:40px;border:3px solid #222;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Back btn */
.back-btn{background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;padding:8px 0;display:inline-flex;align-items:center;gap:6px;margin-bottom:16px;font-weight:500}
.back-btn:hover{opacity:0.8}

.results-info{font-size:14px;color:var(--muted);margin-bottom:16px}

/* Responsive */
@media(max-width:768px){
  nav{flex-wrap:wrap;gap:12px}
  .search-box{order:3;max-width:100%;flex-basis:100%}
  .nav-links{order:2}
  .detail-overlay{flex-direction:column;align-items:center;padding:30px 20px}
  .detail-poster{width:160px}
  .detail-info h1{font-size:24px;text-align:center}
  .detail-meta,.genre-tags{justify-content:center}
  .detail-actions{justify-content:center}
  .overview{text-align:center;margin:0 auto}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .episode-card{flex-direction:column}
  .episode-thumb{width:100%;height:120px}
  .hero{height:280px}
  .hero-content h1{font-size:24px}
  .player-body iframe{height:50vh}
}
</style>
</head>
<body>
<div class="container">
  <nav>
    <div class="logo">MediaHub</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies, TV shows, anime..." onkeydown="if(event.key==='Enter')doSearch()">
      <select id="searchType">
        <option value="multi">All</option>
        <option value="movie">Movies</option>
        <option value="tv">TV Shows</option>
        <option value="anime">Anime</option>
      </select>
    </div>
    <div class="nav-links">
      <button class="active" onclick="showHome()">Home</button>
      <button onclick="document.getElementById('searchInput').focus();doSearch()">Search</button>
    </div>
  </nav>

  <div id="homePage">
    <div class="hero" id="heroBanner">
      <div class="hero-content">
        <span class="badge trending">Trending Now</span>
        <h1 id="heroTitle">Welcome to MediaHub</h1>
        <p id="heroDesc">Search and stream movies, TV shows, and anime from multiple sources.</p>
      </div>
    </div>

    <div class="trend-tabs">
      <button class="active" onclick="switchTrend('all',this)">All</button>
      <button onclick="switchTrend('movie',this)">Movies</button>
      <button onclick="switchTrend('tv',this)">TV</button>
    </div>

    <div class="section-header">
      <h2>Trending</h2>
    </div>
    <div class="grid" id="trendingGrid"></div>
  </div>

  <div id="detailPage" class="detail-page"></div>

  <div id="searchPage" class="detail-page">
    <button class="back-btn" onclick="showHome()">&larr; Back</button>
    <div class="section-header"><h2 id="searchTitle">Search Results</h2></div>
    <div class="results-info" id="searchInfo"></div>
    <div class="grid" id="searchGrid"></div>
  </div>
</div>

<!-- Player -->
<div class="player-overlay" id="playerOverlay">
  <div class="player-header">
    <h3 id="playerTitle">Now Playing</h3>
    <button onclick="closePlayer()">&times;</button>
  </div>
  <div class="player-body">
    <div class="source-tabs" id="sourceTabs"></div>
    <iframe id="playerFrame" allowfullscreen allow="autoplay;fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
  </div>
</div>

<script>
const IMG = 'https://image.tmdb.org/t/p'
const GENRES = {28:'Action',12:'Adventure',16:'Animation',35:'Comedy',80:'Crime',99:'Documentary',18:'Drama',10751:'Family',14:'Fantasy',36:'History',27:'Horror',10402:'Music',9648:'Mystery',10749:'Romance',878:'Sci-Fi',10770:'TV Movie',53:'Thriller',10752:'War',37:'Western',10759:'Action & Adventure',10765:'Sci-Fi & Fantasy',10768:'War & Politics'}
// 🔧 Set your Vercel API URL here when deploying to Cloudflare
// Local dev: '/api' | Deployed: 'https://your-project.vercel.app/api'
const API_BASE = '/api'
let currentItem = null, currentSeason = 1, currentSources = [], currentSourceIdx = 0

function $(id){return document.getElementById(id)}

function showHome(){
  $('homePage').style.display='block';$('detailPage').style.display='none';$('searchPage').style.display='none'
  document.title='MediaHub - Movies, TV & Anime'
}

async function fetchAPI(path){
  try{const r=await fetch(API_BASE + path);return await r.json()}catch(e){return null}
}

// --- Trending ---
let trendType='all'
async function loadTrending(){
  const d=await fetchAPI(`/trending?media=${trendType}`)
  if(!d)return
  const grid=$('trendingGrid')
  grid.innerHTML=d.results.slice(0,20).map(item=>{
    const title=item.title||item.name||'Untitled'
    const date=item.release_date||item.first_air_date||''
    const year=date?date.split('-')[0]:''
    const rating=item.vote_average?item.vote_average.toFixed(1):''
    const poster=item.poster_path?`${IMG}/w342${item.poster_path}`:''
    const media=item.media_type||trendType
    return `<div class="card" onclick="openDetail('${media}',${item.id})">
      <div class="card-poster" style="background-image:url('${poster||'https://placehold.co/342x513/141414/fff/?text=No+Poster'}')">
        ${rating?`<span class="rating">${rating}</span>`:''}
      </div>
      <div class="card-info">
        <h3>${title}</h3>
        <p>${year}${media==='movie'?' • Movie':' • TV'}</p>
      </div>
    </div>`
  }).join('')
}

function switchTrend(type,btn){
  trendType=type
  document.querySelectorAll('.trend-tabs button').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active')
  loadTrending()
}

// --- Search ---
async function doSearch(page=1){
  const q=$('searchInput').value.trim()
  const type=$('searchType').value
  if(!q)return
  $('homePage').style.display='none';$('detailPage').style.display='none';$('searchPage').style.display='block'
  $('searchTitle').textContent=`Search: "${q}"`
  $('searchInfo').textContent='Searching...'
  $('searchGrid').innerHTML='<div class="loading"><div class="spinner"></div></div>'

  if(type==='anime'){
    const d=await fetchAPI(`/anime/search?q=${encodeURIComponent(q)}&page=${page}`)
    if(!d||!d.media){$('searchInfo').textContent='No results';$('searchGrid').innerHTML='';return}
    $('searchInfo').textContent=`Found ${d.media.length} results`
    $('searchGrid').innerHTML=d.media.map(item=>{
      const title=item.title?.romaji||item.title?.english||item.title?.native||'Untitled'
      const img=item.coverImage?.large||''
      return `<div class="card" onclick="openDetail('anime',${item.id})">
        <div class="card-poster" style="background-image:url('${img||'https://placehold.co/342x513/141414/fff/?text=No+Poster'}')">
          ${item.averageScore?`<span class="rating">${(item.averageScore/10).toFixed(1)}</span>`:''}
          ${item.episodes?`<span class="episodes-badge">${item.episodes} eps</span>`:''}
        </div>
        <div class="card-info">
          <h3>${title}</h3>
          <p>${item.format||'Anime'}${item.season?` • ${item.season}`:''}</p>
        </div>
      </div>`
    }).join('')
  } else {
    const d=await fetchAPI(`/search?q=${encodeURIComponent(q)}&type=${type}&page=${page}`)
    if(!d||!d.results){$('searchInfo').textContent='No results';$('searchGrid').innerHTML='';return}
    const results=d.results.filter(r=>r.media_type!=='person')
    $('searchInfo').textContent=`Found ${results.length} results`
    $('searchGrid').innerHTML=results.map(item=>{
      const title=item.title||item.name||'Untitled'
      const date=item.release_date||item.first_air_date||''
      const year=date?date.split('-')[0]:''
      const rating=item.vote_average?item.vote_average.toFixed(1):''
      const poster=item.poster_path?`${IMG}/w342${item.poster_path}`:''
      const media=item.media_type||type
      return `<div class="card" onclick="openDetail('${media}',${item.id})">
        <div class="card-poster" style="background-image:url('${poster||'https://placehold.co/342x513/141414/fff/?text=No+Poster'}')">
          ${rating?`<span class="rating">${rating}</span>`:''}
        </div>
        <div class="card-info">
          <h3>${title}</h3>
          <p>${year}${media==='movie'?' • Movie':' • TV'}</p>
        </div>
      </div>`
    }).join('')
  }
}

// --- Detail ---
async function openDetail(type,id){
  $('homePage').style.display='none';$('searchPage').style.display='none';$('detailPage').style.display='block'
  const dp=$('detailPage')
  dp.innerHTML='<div class="loading"><div class="spinner"></div></div>'

  if(type==='anime'){
    const d=await fetchAPI(`/anime/${id}`)
    if(!d){dp.innerHTML='<p>Error loading</p>';return}
    currentItem={type:'anime',id,title:d.title?.romaji||d.title?.english||'Untitled'}
    const img=d.coverImage?.large||''
    const banner=d.coverImage?.bannerImage||''
    const desc=d.description?.replace(/<[^>]*>/g,'')||'No description available.'
    dp.innerHTML=`
      <button class="back-btn" onclick="showHome()">&larr; Back</button>
      <div class="detail-hero">
        <div class="detail-bg" style="background-image:url('${banner||img||'https://placehold.co/1280x720/1a1a2e/fff'}')"></div>
        <div class="detail-overlay">
          <div class="detail-poster" style="background-image:url('${img||'https://placehold.co/342x513/141414/fff/?text=No+Poster'}')"></div>
          <div class="detail-info">
            <h1>${currentItem.title}</h1>
            <div class="detail-meta">
              <span>${d.format||'Anime'}</span>
              ${d.status?`<span>${d.status}</span>`:''}
              ${d.episodes?`<span>${d.episodes} Episodes</span>`:''}
              ${d.averageScore?`<span>⭐ ${(d.averageScore/10).toFixed(1)}</span>`:''}
              ${d.startDate?.year?`<span>${d.startDate.year}</span>`:''}
              ${d.duration?`<span>${d.duration}m</span>`:''}
            </div>
            <p class="overview">${desc}</p>
            <div class="genre-tags">${(d.genres||[]).map(g=>`<span>${g}</span>`).join('')}</div>
            <div class="detail-actions" style="margin-top:16px">
              <button class="btn-play" onclick="playItem('anime',${id})">▶ Play Now</button>
            </div>
          </div>
        </div>
      </div>`
  } else {
    const d=await fetchAPI(`/${type}/${id}`)
    if(!d){dp.innerHTML='<p>Error loading</p>';return}
    const title=d.title||d.name||'Untitled'
    const year=(d.release_date||d.first_air_date||'').split('-')[0]||''
    const poster=d.poster_path?`${IMG}/w342${d.poster_path}`:''
    const bg=d.backdrop_path?`${IMG}/w1280${d.backdrop_path}`:''
    const rating=d.vote_average?d.vote_average.toFixed(1):''
    const runtime=type==='movie'?d.runtime?`${d.runtime}m`:'' :''
    const genres=(d.genres||[]).map(g=>g.name||g)
    const desc=d.overview||'No description available.'
    currentItem={type,id,title}

    dp.innerHTML=`
      <button class="back-btn" onclick="showHome()">&larr; Back</button>
      <div class="detail-hero">
        <div class="detail-bg" style="background-image:url('${bg||'https://placehold.co/1280x720/1a1a2e/fff'}')"></div>
        <div class="detail-overlay">
          <div class="detail-poster" style="background-image:url('${poster||'https://placehold.co/342x513/141414/fff/?text=No+Poster'}')"></div>
          <div class="detail-info">
            <h1>${title}</h1>
            <div class="detail-meta">
              ${year?`<span>${year}</span>`:''}
              ${rating?`<span>⭐ ${rating}</span>`:''}
              ${runtime?`<span>${runtime}</span>`:''}
              ${d.status?`<span>${d.status}</span>`:''}
              ${type==='tv'&&d.number_of_seasons?`<span>${d.number_of_seasons} Seasons</span>`:''}
            </div>
            <p class="overview">${desc}</p>
            <div class="genre-tags">${genres.map(g=>`<span>${g}</span>`).join('')}</div>
            <div class="detail-actions" style="margin-top:16px">
              ${type==='movie'?`<button class="btn-play" onclick="playItem('movie',${id})">▶ Play Now</button>`:''}
              ${type==='tv'?`<button class="btn-play" onclick="playItem('tv',${id},1,1)">▶ Play S1:E1</button>`:''}
            </div>
          </div>
        </div>
      </div>
      ${type==='tv'?`<div id="seasonsSection"></div>`:''}`

    if(type==='tv') loadSeasons(id)
  }
}

async function loadSeasons(tvId){
  const d=await fetchAPI(`/tv/${tvId}`)
  if(!d||!d.seasons)return
  const seasons=d.seasons.filter(s=>s.season_number>0)
  let html=`<div class="season-tabs">${seasons.map((s,i)=>`<button class="${i===0?'active':''}" onclick="loadEpisodes(${tvId},${s.season_number},this)">${s.name||'Season '+s.season_number}</button>`).join('')}</div>
  <div id="episodesContainer"></div>`
  $('seasonsSection').innerHTML=html
  if(seasons.length) loadEpisodes(tvId,seasons[0].season_number)
}

async function loadEpisodes(tvId,season,btn){
  if(btn){document.querySelectorAll('.season-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
  currentSeason=season
  const d=await fetchAPI(`/tv/${tvId}/season/${season}`)
  if(!d||!d.episodes) return
  currentItem={type:'tv',id:tvId,title:currentItem?.title||'',season}
  $('episodesContainer').innerHTML=`<div class="episodes-grid">
    ${d.episodes.map(ep=>{
      const still=ep.still_path?`${IMG}/w300${ep.still_path}`:''
      return `<div class="episode-card" onclick="playItem('tv',${tvId},${season},${ep.episode_number})">
        <div class="episode-thumb" style="background-image:url('${still||'https://placehold.co/300x169/1a1a2e/666/?text=Episode+'+ep.episode_number}')"></div>
        <div class="episode-info">
          <div class="episode-num">EPISODE ${ep.episode_number}</div>
          <h4>${ep.name||'Episode '+ep.episode_number}</h4>
          ${ep.overview?`<p>${ep.overview}</p>`:''}
        </div>
      </div>`
    }).join('')}
  </div>`
}

// --- Player ---
async function playItem(type,id,season,episode){
  $('playerOverlay').classList.add('active')
  const title=currentItem?.title||'Now Playing'
  $('playerTitle').textContent=title
  $('playerFrame').src=''
  
  const srcUrl=`/sources?type=${type}&id=${id}${type==='tv'?`&season=${season}&episode=${episode}`:''}`
  const d=await fetchAPI(srcUrl)
  currentSources=d?.sources||[]
  currentSourceIdx=0

  const tabs=$('sourceTabs')
  tabs.innerHTML=currentSources.map((s,i)=>`<button class="${i===0?'active':''}" onclick="switchSource(${i},this)">${s.name}</button>`).join('')
  if(currentSources.length) loadSource(0)
}

function switchSource(idx,btn){
  if(btn){document.querySelectorAll('#sourceTabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
  currentSourceIdx=idx;loadSource(idx)
}

function loadSource(idx){
  const src=currentSources[idx]
  if(!src)return
  $('playerFrame').src=src.url
}

function closePlayer(){
  $('playerOverlay').classList.remove('active')
  $('playerFrame').src=''
}

// --- Popup Blocker ---
;(function(){
  window.open = function(){ return null }
  document.addEventListener('click',function(e){
    const a = e.target.closest('a[target="_blank"]')
    if(a){ e.preventDefault(); e.stopPropagation(); return false }
  },true)
})()

loadTrending()
